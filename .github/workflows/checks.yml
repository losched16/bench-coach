# BenchCoach checks.
#
# IMPORTANT, AND EASY TO GET WRONG: this workflow does NOT block anything
# today. The repository has no branch protection, so a red run here does not
# stop a merge and does not stop a deploy — `git push origin main` goes
# straight to Vercel regardless of what this says.
#
# The thing that actually blocks production is `npm run gate`, which runs as
# `prebuild` inside the Vercel build. See docs/release-gates.md.
#
# So what is this for? The browser suite, which cannot run in a Vercel build
# container (no Chromium, no dev server). It is the only place the practice
# page's "does it render at all" check can live. To make it binding, see the
# branch-protection section of docs/release-gates.md — that is a repository
# settings change and it is Clint's to make, because it also changes how he
# pushes.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # The gate's environment check requires these. They are not secrets: the URL
  # and anon key are public by design (the anon key is shipped to every
  # browser), and nothing in CI talks to production — the browser suite points
  # at an in-memory fixture on localhost.
  NEXT_PUBLIC_SUPABASE_URL: https://chdpqsumqospnaztvfqe.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-key
  ADMIN_EMAIL: ci@example.invalid

# The job `name:` values below are what GitHub publishes as check-run names,
# and therefore what a branch ruleset must require BY EXACT STRING. They are
# kept short and boring on purpose: renaming a job silently un-requires it,
# and a required check that no longer exists blocks every merge instead.
#
#   gate  ·  suites  ·  browser  ·  analyzer
#
jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: npm run gate
        run: npm run gate

  suites:
    name: suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Not in the build gate: slower, and a build gate that takes minutes is a
      # build gate somebody deletes.
      - run: npm run test:player-pathways
      - run: npm run test:pathways
      - run: npm run test:pathway-ui
      # Player scope: the rule, the context builder, lib/authz.ts and the
      # routes that read or store a player id. Starts a local stand-in for the
      # auth server and the model API on 127.0.0.1; nothing external is called.
      - run: npm run test:player-scope
      # Development plans in the AI context: scoping, limits, and delivery to
      # each route's prompt. The second starts a capture server on 127.0.0.1
      # in place of the model API; no model is called.
      - run: npm run test:pathway-context
      - run: npm run test:pathway-context-consumers
      - run: npm run test:observation-scope
      - run: npm run test:practice-plan-link
      - run: npm run test:drill-finder
      - run: npm run test:pitch-count
      # Chat "Work this up into a plan" builds the plan the coach agreed to.
      - run: npm run test:agreed-plan
      # A chat answer does not depend on the coach watching the screen.
      - run: npm run test:chat-pending
      # Swing mechanics POC (flag-off by default): app rules, store and gates.
      - run: npm run test:swing-poc

  # Swing mechanics POC analyzer (Python). Synthetic adult fixtures only —
  # built from MediaPipe's own test image, never a real player's video.
  # Fails if any test is skipped, so a missing model or fixture can't pass
  # quietly.
  analyzer:
    name: analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analyzer/requirements.txt
      - name: system libraries (ffmpeg, EGL for MediaPipe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgles2 libgl1
      - run: pip install -r requirements.txt
      - name: pose model (checksum-verified)
        run: scripts/fetch_model.sh
      - name: synthetic fixtures (checksum-verified source image)
        run: |
          scripts/fetch_test_image.sh .cache/pose.jpg
          python -m swing_analyzer fixtures .cache/pose.jpg fixtures --phone
      - name: analyzer tests
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee .cache/unittest.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q "skipped" .cache/unittest.log; then echo "::error::analyzer tests were skipped"; exit 1; fi

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: npm run test:browser
        run: npm run test:browser
      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: docs/audits/*.png
          if-no-files-found: ignore
